<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Uncensored Engine</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0d0f12; color: #e3e3e3; font-family: system-ui, -apple-system, sans-serif; }
        .sidebar { background-color: #15191e; border-right: 1px solid #222933; }
        .message-user { background-color: #222933; border: 1px solid #2d3748; border-radius: 18px 18px 4px 18px; }
        .message-ai { background-color: transparent; border-radius: 18px; }
        .input-area { background-color: #15191e; border: 1px solid #2d3748; border-radius: 24px; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden m-0">

    <!-- SIDEBAR CRONOLOGIA -->
    <aside class="sidebar w-80 flex flex-col justify-between hidden md:flex">
        <div class="p-4 flex flex-col h-full overflow-hidden">
            <button onclick="createNewChat()" class="w-full py-3 px-4 mb-4 border border-dashed border-zinc-600 rounded-xl flex items-center justify-center gap-2 hover:bg-zinc-800 transition text-sm font-medium text-white">
                <i class="fa-solid fa-plus"></i> Nuova Sessione
            </button>
            <div class="flex-1 overflow-y-auto custom-scrollbar" id="history-list"></div>
        </div>
        <div class="p-4 border-t border-zinc-800 text-xs text-zinc-500 flex items-center justify-between">
            <span>Modalità: Esecuzione Diretta</span>
            <span class="flex items-center gap-1"><span class="h-2 w-2 rounded-full bg-red-500 inline-block animate-pulse"></span> Raw AI Active</span>
        </div>
    </aside>

    <!-- AREA CHAT PRINCIPALE -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Header -->
        <header class="h-16 border-b border-zinc-800 flex items-center justify-between px-6 bg-[#0d0f12]">
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-lg bg-gradient-to-tr from-red-600 to-orange-400 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-terminal text-white text-sm"></i>
                </div>
                <h1 class="font-semibold text-lg bg-gradient-to-r from-white to-zinc-400 bg-clip-text text-transparent">Custom Core AI</h1>
            </div>
            <div class="text-sm text-zinc-400 flex items-center gap-2">
                <i class="fa-solid fa-unlock-keyhole text-red-400"></i> Zero Restrizioni Filtri
            </div>
        </header>

        <!-- Finestra Messaggi -->
        <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar flex flex-col">
            <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center text-center max-w-lg mx-auto space-y-4">
                <div class="p-4 bg-zinc-900/50 rounded-full border border-zinc-800 mb-2">
                    <i class="fa-solid fa-skull-crossbones text-3xl text-red-400"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Nessun Limite, Solo Ordini</h2>
                <p class="text-zinc-400 text-sm leading-relaxed">Modello Open Source configurato per ignorare le risposte preconfezionate e i blocchi morali aziendali. Esegue codice, analizza testi e risponde senza filtri.</p>
            </div>
        </div>

        <!-- Box Anteprima File Caricati -->
        <div id="file-preview-container" class="px-6 hidden">
            <div class="p-3 bg-zinc-900 border border-zinc-800 rounded-xl inline-flex items-center gap-3 relative max-w-xs">
                <div id="file-icon-preview" class="h-10 w-10 bg-zinc-800 rounded-lg flex items-center justify-center text-red-400 text-lg overflow-hidden"></div>
                <div class="text-xs truncate pr-4">
                    <p id="file-name-preview" class="font-medium text-white truncate"></p>
                    <p id="file-size-preview" class="text-zinc-500"></p>
                </div>
                <button onclick="clearAttachedFile()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">
                    <i class="fa-solid fa-x"></i>
                </button>
            </div>
        </div>

        <!-- Input Barra di Controllo -->
        <div class="p-6 bg-gradient-to-t from-[#0d0f12] via-[#0d0f12] to-transparent">
            <div class="max-w-4xl mx-auto input-area p-3 flex flex-col gap-2">
                <textarea id="user-input" rows="1" placeholder="Scrivi il tuo ordine senza censure..." class="w-full bg-transparent outline-none resize-none px-2 pt-1 text-white placeholder-zinc-500 text-sm custom-scrollbar max-h-36" oninput="autoGrow(this)"></textarea>
                <div class="flex items-center justify-between border-t border-zinc-800/60 pt-2 px-1">
                    <div class="flex items-center gap-2">
                        <button onclick="document.getElementById('file-upload').click()" class="h-8 w-8 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-white transition flex items-center justify-center" title="Carica file di testo">
                            <i class="fa-solid fa-paperclip text-sm"></i>
                        </button>
                        <input type="file" id="file-upload" class="hidden" accept="text/*" onchange="handleFileSelection(event)">
                    </div>
                    <button onclick="sendMessage()" id="send-btn" class="h-8 px-4 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700 transition flex items-center gap-2 text-xs shadow-md">
                        Esegui <i class="fa-solid fa-bolt text-[10px]"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURAZIONE CHIAVE API (Prendi una chiave gratis su ://groq.com)
        const GROQ_API_KEY = 'IL_TUO_GROQ_API_KEY'; 

        let chatHistory = JSON.parse(localStorage.getItem('uncensored_hub_history')) || [];
        let currentChatId = null;
        let attachedFileContent = null;
        let attachedFileName = null;

        window.onload = function() {
            renderHistoryList();
            if(chatHistory.length > 0) { loadChat(chatHistory.id); } else { createNewChat(); }
        };

        function autoGrow(element) {
            element.style.height = "24px";
            element.style.height = (element.scrollHeight - 10) + "px";
        }

        function createNewChat() {
            const newChat = { id: Date.now().toString(), title: "Nuovo Ordine", messages: [] };
            chatHistory.unshift(newChat);
            saveHistory();
            renderHistoryList();
            loadChat(newChat.id);
        }

        function saveHistory() { localStorage.setItem('uncensored_hub_history', JSON.stringify(chatHistory)); }

        function renderHistoryList() {
            const container = document.getElementById('history-list');
            container.innerHTML = '';
            chatHistory.forEach(chat => {
                const activeClass = chat.id === currentChatId ? 'bg-zinc-800 text-white' : 'text-zinc-400 hover:bg-zinc-900/50';
                container.innerHTML += `
                    <div class="group flex items-center justify-between p-3 mb-1 rounded-xl cursor-pointer transition ${activeClass}" onclick="loadChat('${chat.id}')">
                        <div class="flex items-center gap-3 truncate flex-1">
                            <i class="fa-solid fa-bolt text-red-500 text-xs"></i>
                            <span class="text-sm truncate font-medium">${chat.title}</span>
                        </div>
                        <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1 text-zinc-500 hover:text-red-400 transition text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });
        }

        function loadChat(id) {
            currentChatId = id;
            renderHistoryList();
            const chat = chatHistory.find(c => c.id === id);
            const windowEl = document.getElementById('chat-window');
            windowEl.innerHTML = '';

            if(!chat || chat.messages.length === 0) {
                document.getElementById('chat-window').innerHTML = document.getElementById('welcome-screen').outerHTML;
                return;
            }
            chat.messages.forEach(msg => { if(msg.role !== 'system') appendMessageToUI(msg.role, msg.content); });
            scrollToBottom();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            chatHistory = chatHistory.filter(c => c.id !== id);
            saveHistory();
            if (currentChatId === id) currentChatId = chatHistory.length > 0 ? chatHistory.id : null;
            if(!currentChatId) { createNewChat(); } else { loadChat(currentChatId); }
        }

            const file = event.target.files[0];
            if (!file) return;
            attachedFileName = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                attachedFileContent = e.target.result;

}

headers: {

}
